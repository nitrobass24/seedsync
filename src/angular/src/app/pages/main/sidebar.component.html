<div id="sidebar">
  @for (routeInfo of routeInfos; track routeInfo.path) {
    <a class="button"
       [routerLink]="routeInfo.path"
       routerLinkActive="selected">
      <img [src]="routeInfo.icon" alt="" aria-hidden="true" />
      <span class="text">{{ routeInfo.name }}</span>
    </a>
  }

  <hr>

  <button type="button" class="button"
     [disabled]="!commandsEnabled()"
     (click)="!commandsEnabled() || onCommandRestart()">
    <img src="assets/icons/refresh.svg" alt="" aria-hidden="true" />
    <span class="text">Restart</span>
  </button>

  <button type="button" class="button" (click)="onToggleTheme()">
    <svg class="icon-svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      @if (theme() === 'light') {
        <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278z"/>
      } @else {
        <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>
      }
    </svg>
    <span class="text">{{ theme() === 'light' ? 'Dark Mode' : 'Light Mode' }}</span>
  </button>
</div>
