<div id="file-list">
    <div id="header">
        <div class="checkbox">
            <input type="checkbox" aria-label="Select all files" (change)="$any($event.target).checked ? onCheckAll() : onUncheckAll()" />
        </div>
        <div class="name">Filename</div>
        <div class="pair">Pair</div>
        <div class="status">Status</div>
        <div class="speed">Speed</div>
        <div class="eta">ETA</div>
        <div class="size">Size</div>
    </div>
    @if ((checked$ | async); as checked) {
      @if (checked.size) {
        <app-bulk-action-bar
            [count]="checked.size"
            (actionEvent)="onBulkAction($event)"
            (clearEvent)="onUncheckAll()">
        </app-bulk-action-bar>
      }
    }
    <ng-template #fileRow let-row let-isEven="isEven">
        <div class="file-row" [class.even]="isEven">
            <app-file
                [file]="row.file"
                [options]="options"
                [depth]="row.depth"
                [hasChildren]="row.hasChildren"
                [isExpanded]="row.isExpanded"
                (click)="onSelect(row.file)"
                (checkEvent)="onCheck($event)"
                (toggleExpandEvent)="onToggleExpand($event)"
                (actionEvent)="onAction($event)"
                (cleanupLocalEvent)="onCleanupLocal($event)">
            </app-file>
        </div>
    </ng-template>
    @if (useNativeScrolling()) {
        <div class="file-viewport native-file-viewport">
            @for (row of files | async; track identify($index, row); let isEven = $even) {
                <ng-container [ngTemplateOutlet]="fileRow" [ngTemplateOutletContext]="{$implicit: row, isEven: isEven}" />
            }
        </div>
    } @else {
        <cdk-virtual-scroll-viewport itemSize="82" class="file-viewport">
            <ng-container *cdkVirtualFor="let row of files; trackBy: identify; let isEven = even">
                <ng-container [ngTemplateOutlet]="fileRow" [ngTemplateOutletContext]="{$implicit: row, isEven: isEven}" />
            </ng-container>
        </cdk-virtual-scroll-viewport>
    }
</div>
